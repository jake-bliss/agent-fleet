<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADW Board</title>
<link rel="icon" id="favicon" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650&display=swap" rel="stylesheet">
<meta name="color-scheme" content="dark light">
<style>:root {
  --bg: #0f0f10; --card: #18181b; --raised: #232326; --hover: #1f1f23; --ink: #ececf0; --muted: #a8a8b3; --faint: #8b8b96;
  --line: #27272a; --input: #3a3a40; --accent: #8ab4ff; --primary: #ececf0; --on-primary: #0f0f10;
  --red: #f0716b; --amber: #e0b04c; --green: #5fc58a; --blue: #6aa6f8; --queued: #6b6b75;
  --code: #131316; --shadow: 0 1px 2px rgba(0,0,0,.4);
  --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --r: 14px; --r-sm: 10px;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f6f6f7; --card: #ffffff; --raised: #f0f0f2; --hover: #f4f4f6; --ink: #18181b; --muted: #52525b; --faint: #71717a;
    --line: #e4e4e7; --input: #cfcfd4; --accent: #2f5fd0; --primary: #18181b; --on-primary: #fafafa;
    --red: #d1342d; --amber: #a86e00; --green: #1d8a4e; --blue: #2563c9; --queued: #a1a1aa;
    --code: #f4f4f5; --shadow: 0 1px 2px rgba(0,0,0,.06);
  }
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color-scheme: dark light; }
body { margin: 0; color: var(--ink); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--input); border-radius: 8px; border: 2px solid var(--bg); }
header { display: flex; align-items: center; gap: 12px 14px; padding: 28px 24px 14px; flex-wrap: wrap; max-width: 1200px; margin: 0 auto; }
h1 { font-weight: 650; font-size: 22px; letter-spacing: -.02em; margin: 0; }
.summary { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 10px 28px; font-size: 14px; color: var(--muted); padding-top: 6px; }
.summary b { font-size: 24px; color: var(--ink); font-weight: 600; margin-right: 7px; letter-spacing: -.02em; }
.summary .hot b { color: var(--red); }
.meta { color: var(--muted); font-size: 13px; }
main { display: flex; flex-direction: column; gap: 16px; max-width: 1200px; margin: 0 auto; padding: 8px 24px 56px; }
section { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 20px 22px; min-width: 0; box-shadow: var(--shadow); }
h2 { font-size: 13px; font-weight: 600; margin: 0 0 12px; color: var(--muted); letter-spacing: .01em; }
h2 .n { color: var(--ink); background: var(--raised); border-radius: 999px; padding: 1px 9px; margin-left: 4px; font-size: 12px; }
.item { padding: 12px 0; border-top: 1px solid var(--line); }
.row { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.epic { font-weight: 600; font-size: 15px; }
.tag { font-size: 11.5px; font-weight: 500; padding: 1px 9px; border-radius: 999px; background: var(--raised); color: var(--muted); white-space: nowrap; }
.tag.red { color: var(--red); background: color-mix(in srgb, var(--red) 14%, transparent); }
.tag.amber { color: var(--amber); background: color-mix(in srgb, var(--amber) 14%, transparent); }
.tag.green { color: var(--green); background: color-mix(in srgb, var(--green) 14%, transparent); }
.red { color: var(--red); } .amber { color: var(--amber); } .green { color: var(--green); } .blue { color: var(--blue); }
.dim { color: var(--muted); }
.mono, code { font-family: var(--mono); font-size: 12.5px; }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; text-underline-offset: 3px; }
ul { margin: 6px 0 0; padding-left: 20px; } li { margin: 4px 0; }
details > summary { cursor: pointer; color: var(--muted); font-size: 14px; margin-top: 6px; }
details > summary:hover { color: var(--ink); }
table { width: 100%; border-collapse: collapse; }
td, th { text-align: left; padding: 12px 12px 12px 0; border-top: 1px solid var(--line); vertical-align: top; }
th { color: var(--faint); font-weight: 500; font-size: 12px; border-top: 0; padding-bottom: 8px; }
#err { color: var(--red); padding: 8px 24px 0; max-width: 1200px; margin: 0 auto; }
.decision { background: var(--raised); border-radius: var(--r-sm); padding: 14px 16px; margin: 12px 0; }
.body { margin-top: 10px; max-height: 420px; overflow: auto; color: var(--ink); }
.body h1, .body h2, .body h3 { font-size: 15px; font-weight: 600; margin: 14px 0 4px; color: var(--ink); }
.body p { margin: 6px 0; }
.body b, .body strong { font-weight: 600; }
.body code { background: var(--raised); padding: 1px 6px; border-radius: 6px; }
.body pre { background: var(--code); padding: 10px 12px; overflow-x: auto; border-radius: var(--r-sm); }
.body pre code { background: transparent; padding: 0; }
.body table { display: block; overflow-x: auto; }
.screen { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; background: var(--code); border-radius: var(--r-sm); padding: 10px 12px; max-height: 260px; overflow: auto; margin-top: 6px; }
.opts { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
.opt { text-align: left; padding: 10px 14px; border: 1px solid var(--line); border-radius: var(--r-sm); background: transparent; color: var(--ink); cursor: pointer; font: inherit; }
.opt:hover:not(:disabled) { background: var(--hover); }
.opt.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
.opt .k { font-weight: 600; margin-right: 8px; color: var(--accent); }
textarea, .inp, .linksel, input { border-radius: var(--r-sm); border: 1px solid var(--input); background: var(--bg); color: var(--ink); font: inherit; accent-color: var(--accent); }
textarea::placeholder, input::placeholder { color: var(--faint); }
textarea { width: 100%; min-height: 54px; margin-top: 10px; padding: 10px 12px; resize: vertical; }
.actions { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
button.go { display: inline-flex; align-items: center; gap: 6px; padding: 7px 16px; border-radius: 999px; border: 0; background: var(--primary); color: var(--on-primary); cursor: pointer; font: 600 14px var(--sans); transition: opacity .15s; }
button.go:hover:not(:disabled) { opacity: .85; }
button.go:disabled { opacity: .4; cursor: not-allowed; }
button.go.danger { background: transparent; border: 1px solid var(--red); color: var(--red); }
button.ghost { padding: 6px 14px; border-radius: 999px; border: 1px solid var(--input); background: transparent; color: var(--ink); cursor: pointer; font: 500 13.5px var(--sans); transition: background .15s; }
button.ghost:hover { background: var(--hover); }
button.ghost.danger { border-color: var(--red); color: var(--red); }
button:focus-visible, textarea:focus-visible, input:focus-visible, select:focus-visible, .opt:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.status { font-size: 13px; color: var(--muted); }
.linksel { margin-top: 4px; max-width: 220px; padding: 4px 8px; font-size: 13px; }
[data-view] { cursor: pointer; color: var(--accent); }
[data-view]:hover { text-decoration: underline; text-underline-offset: 3px; }
#viewer { position: fixed; inset: 0; background: var(--bg); z-index: 10; display: none; flex-direction: column; }
#viewer.open { display: flex; }
#v-head { display: flex; gap: 10px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; background: var(--card); }
#v-term { flex: 1; overflow: auto; margin: 0; padding: 10px 16px; font-family: var(--mono);
  font-size: 12px; line-height: 1.4; white-space: pre-wrap; word-break: break-word; background: #0a0a0b; color: #e4e4e7; }
#v-foot { border-top: 1px solid var(--line); padding: 10px 16px 14px; background: var(--card); }
.keys { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.keys button { min-width: 44px; min-height: 38px; font-family: var(--mono); }
#viewer:not(.keys-on) .keys { display: none; }
#v-keys { min-width: 44px; min-height: 44px; }
#v-keys[aria-pressed="true"] { background: var(--line); }
.v-row { display: flex; gap: 8px; align-items: flex-end; }
.v-row textarea { margin: 0; min-height: 44px; }
.inp { display: block; width: 100%; margin-top: 4px; padding: 9px 12px; }
.wrap { display: block; overflow-x: auto; }
.hist { margin-top: 8px; padding-left: 12px; font-size: 13px; }
.hist .ev, .evlist .ev { padding: 4px 0; }
.nrow { border-top: 1px solid var(--line); }
.nrow > summary, .nrow > .nsum { list-style: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 12px 0; margin: 0; cursor: pointer; color: var(--ink); font-size: 15px; }
.nrow > .nsum { cursor: default; }
.nrow > summary::-webkit-details-marker { display: none; }
.nrow > summary::before { content: "\25B8"; color: var(--faint); width: 12px; }
.nrow[open] > summary::before { content: "\25BE"; }
.nrow .ttl { flex: 1 1 260px; min-width: 0; font-weight: 550; overflow-wrap: anywhere; }
.nrow .rb { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-left: auto; }
.nrow .sub { color: var(--muted); font-size: 14px; margin: -6px 0 12px 0; }
.nrow .nbody { padding: 0 0 16px 24px; }
.nrow .nbody .actions { margin-top: 8px; }
.nrow .rb.actions { margin-top: 0; }
.nrow.answered { opacity: .75; }
.nrow .rb > button.go { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: inline-block; }
@media (min-width: 521px) { .nrow .rb > button.go { max-width: 380px; } }
.hrs { width: 90px; display: inline-block; margin: 0; padding: 6px 10px; }
.pbar { display: flex; height: 8px; width: 100%; min-width: 120px; background: var(--raised); border-radius: 999px; overflow: hidden; gap: 2px; }
.pbar > span { display: block; height: 100%; }
.pbar .p-done { background: var(--green); } .pbar .p-fl { background: var(--blue); } .pbar .p-q { background: var(--queued); } .pbar .p-bl { background: var(--red); }
.pnums { display: flex; gap: 4px 14px; flex-wrap: wrap; font-size: 13px; margin-top: 6px; color: var(--muted); }
.pnums b { font-weight: 600; }
.pnums .z { opacity: .45; }
tr.erow { cursor: pointer; }
.etoggle { all: unset; cursor: pointer; display: block; border-radius: 6px; }
.etoggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.go.armed { background: var(--amber); color: #0f0f10; }
tr.erow:hover > td { background: var(--hover); }
tr.erow.idle > td { opacity: .55; }
tr.erow.open > td { background: var(--hover); }
tr.edet > td { padding: 0 0 16px; background: var(--hover); border-top: 0; }
.edet .pad { padding: 8px 16px; display: grid; gap: 12px; }
.edet h4 { margin: 0 0 4px; font: 600 12px var(--sans); color: var(--faint); }
.edet ul { margin: 0; }
.asks { display: inline-block; min-width: 24px; text-align: center; padding: 1px 9px; border-radius: 999px; background: color-mix(in srgb, var(--red) 16%, transparent); color: var(--red); font-weight: 600; }
.tblbox { overflow-x: auto; }
.sec > summary { margin: 0; font-size: 14px; color: var(--muted); }
.sec > summary h2 { margin: 0; }
.sec[open] > summary { margin-bottom: 14px; }
@media (max-width: 520px) {
  header { padding: 18px 16px 10px; gap: 8px; }
  main { padding: 6px 12px 32px; gap: 12px; }
  section { padding: 16px; }
  .summary { gap: 8px 20px; }
  .nrow .rb { margin-left: 0; width: 100%; padding-left: 24px; min-width: 0; }
  .nrow .nbody { padding-left: 0; }
  .decision { padding: 12px; }
  .body { max-height: none; }
  .opt, button.go, button.ghost { min-height: 44px; }
  textarea, .inp, input { font-size: 16px; }
  .screen { font-size: 11px; }
  #epics table, #epics tbody { display: block; }
  #epics tr:first-child:has(th) { display: none; }
  #epics tr.erow { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px 10px; padding: 14px 0; border-top: 1px solid var(--line); }
  #epics tr.erow td { display: block; padding: 0; border: 0; background: transparent !important; }
  #epics tr.erow td[data-l]::before { content: attr(data-l); display: block; color: var(--faint); font-size: 11px; font-weight: 500; }
  #epics tr.erow .c-name, #epics tr.erow .c-wide { grid-column: 1 / -1; }
  #epics tr.erow .linksel { max-width: 100%; width: 100%; }
  #epics tr:not(.erow) { display: block; }
  #epics tr:not(.erow) > td { display: block; padding: 0; border: 0; }
  #epics .tblbox { overflow-x: visible; }
  #v-term { font-size: 10.5px; padding: 8px; }
  #v-head, #v-foot { padding-left: 10px; padding-right: 10px; }
}
</style>
</head>
<body>
<header>
  <h1>ADW Board</h1>
  <button class="ghost" id="mate-btn" hidden>First mate ›</button>
  <span id="pins" style="display:contents"></span>
  <span class="meta" id="meta">loading…</span>
  <div class="summary" id="summary"></div>
</header>
<div id="err"></div>
<div id="viewer" role="dialog" aria-modal="true">
  <div id="v-head"><button class="ghost" id="v-close">✕ Close</button><span class="mono" id="v-pane"></span>
    <span id="v-title" class="epic"></span><span class="tag" id="v-status"></span><span class="status" id="v-st"></span>
    <button class="ghost" id="v-focus" style="margin-left:auto">Focus pane</button></div>
  <pre id="v-term"></pre>
  <div id="v-foot">
    <div class="keys" id="v-keyset"><button class="ghost" data-key="esc">Esc</button><button class="ghost" data-key="enter">Enter</button><button class="ghost" data-key="up">↑</button><button class="ghost" data-key="down">↓</button><button class="ghost" data-key="tab">Tab</button><button class="ghost" data-key="shift+tab">⇧Tab</button><button class="ghost" data-key="1">1</button><button class="ghost" data-key="2">2</button><button class="ghost" data-key="3">3</button><button class="ghost" data-key="4">4</button><button class="ghost" data-key="y">y</button><button class="ghost" data-key="n">n</button><button class="ghost" data-key="ctrl+c">Ctrl+C</button></div>
    <div class="v-row"><button class="ghost" id="v-keys" aria-controls="v-keyset" aria-pressed="false" title="Show keys">Keys</button><textarea id="v-text" placeholder="Message to the agent (Send = type it + Enter)"></textarea><button class="go" id="v-send">Send</button></div>
  </div>
</div>
<main>
  <section id="needs"></section>
  <section id="epics"></section>
  <section id="since"></section>
  <section id="mate" hidden></section>
  <section id="client-time" hidden></section>
  <section id="logtime" hidden></section>
  <section id="tabs"></section>
  <section id="parked" hidden></section>
  <section id="watch" hidden></section>
  <section id="launch"><details id="launch-d" class="sec"><summary><h2 style="display:inline">Launch agent</h2>
    <span class="dim"> · new herdr tab running claude (launch args set by ADW_LAUNCH_ARGS)</span></summary>
    <div style="display:grid;gap:8px;margin-top:10px">
      <label class="dim">Workspace <select id="l-ws" class="inp"></select></label>
      <label class="dim">Folder inside it (optional) <input id="l-sub" class="inp" list="l-subs" placeholder="e.g. web-app" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
      <datalist id="l-subs"></datalist>
      <div class="dim mono" id="l-path"></div>
      <label class="dim">Tab label (optional) <input id="l-label" class="inp" placeholder="what it is for" autocomplete="off"></label>
      <label class="dim">First prompt (optional) <textarea id="l-prompt" placeholder="Sent once the agent is ready"></textarea></label>
      <div class="actions"><button class="go" id="l-go">Launch</button><span class="status" id="l-st"></span></div>
    </div></details></section>
</main>
<script>
const helm = dot => "data:image/svg+xml," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<rect width="64" height="64" rx="14" fill="#171d1b"/><g stroke="#cfb87b" stroke-linecap="round" fill="none">
<g stroke-width="5">${[0, 45, 90, 135].map(r => `<line x1="32" y1="6" x2="32" y2="58" transform="rotate(${r} 32 32)"/>`).join("")}</g>
<circle cx="32" cy="32" r="16" stroke-width="5"/></g><circle cx="32" cy="32" r="6" fill="#cfb87b"/>
${dot ? `<circle cx="51" cy="13" r="11" fill="#e0533f" stroke="#171d1b" stroke-width="3"/>` : ""}</svg>`);
const setFavicon = dot => { const f = document.getElementById("favicon"), h = helm(dot); if (f.href !== h) f.href = h; };
setFavicon(false);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ago = ts => { const s = Date.now()/1000 - ts;
  return s < 3600 ? `${Math.floor(s/60)}m` : s < 86400 ? `${Math.floor(s/3600)}h` : `${Math.floor(s/86400)}d`; };
const pr = (repo, n) => n ? (/^[\w.-]+\/[\w.-]+$/.test(repo || "") ? ` <a href="https://github.com/${repo}/pull/${encodeURIComponent(n)}" target="_blank">#${esc(n)}</a>` : ` #${esc(n)}`) : "";
const segs = (e, list) => list.map(s => `<span class="mono">${esc(s.id)}</span>${pr(e.repo, s.pr)}`).join(", ");
const md = s => esc(s).replace(/`([^`]+)`/g, '<code class="mono">$1</code>');
const TOKEN = "__ADW_TOKEN__";
const drafts = {}, picks = {}, confirming = {};
const SEEN_KEY = "adw-last-seen-id";
const getSeen = () => { try { return parseInt(localStorage.getItem(SEEN_KEY) || "0", 10) || 0; } catch (e) { return 0; } };
const setSeen = n => { try { localStorage.setItem(SEEN_KEY, String(n)); } catch (e) {} };
let viewFrom = getSeen(), sinceFeed = null, sinceTldr = null, tldrKey = "", visSince = 0;
const hist = {}, expanded = {};
const safeUrl = u => /^https:\/\//.test(u || "") ? u : "";
const LEVEL = { interrupt: "red", wake: "amber", digest: "" };
const evRow = e => `<div class="ev"><span class="tag ${LEVEL[e.level] || ""}">${esc(e.level)}</span> <span class="mono dim">${esc(e.kind)}</span>
  ${e.epic ? `<span class="tag">${esc(e.epic)}</span>` : ""} ${safeUrl(e.url) ? `<a href="${esc(safeUrl(e.url))}" target="_blank">${esc(e.title)}</a>` : esc(e.title)}
  <span class="dim">· ${ago(Date.parse(e.ts) / 1000)} ago</span></div>`;

function mdBlock(src) {
  const out = []; let list = null, code = null, table = null;
  const inline = t => esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s)<]+)/g, '$1<a href="$2" target="_blank">$2</a>');
  const flush = () => {
    if (list) { out.push(`<ul>${list.join("")}</ul>`); list = null; }
    if (table) {
      const rows = table.filter(r => !/^\|?\s*:?-{2,}/.test(r)).map(r => r.replace(/^\||\|$/g, "").split("|").map(c => inline(c.trim())));
      out.push(`<table>${rows.map((r, i) => `<tr>${r.map(c => i ? `<td>${c}</td>` : `<th>${c}</th>`).join("")}</tr>`).join("")}</table>`);
      table = null;
    }
  };
  for (const line of String(src || "").split("\n")) {
    if (code !== null) { if (line.startsWith("```")) { out.push(`<pre><code>${esc(code.join("\n"))}</code></pre>`); code = null; } else code.push(line); continue; }
    if (line.startsWith("```")) { flush(); code = []; continue; }
    if (/^\s*\|.*\|\s*$/.test(line)) { if (list) { out.push(`<ul>${list.join("")}</ul>`); list = null; } (table = table || []).push(line.trim()); continue; }
    const h = line.match(/^(#{1,3})\s+(.*)/); if (h) { flush(); out.push(`<h3>${inline(h[2])}</h3>`); continue; }
    const li = line.match(/^\s*(?:[-*]|\d+\.)\s+(.*)/); if (li) { (list = list || []).push(`<li>${inline(li[1])}</li>`); continue; }
    flush(); if (line.trim()) out.push(`<p>${inline(line)}</p>`);
  }
  if (code !== null) out.push(`<pre><code>${esc(code.join("\n"))}</code></pre>`);
  flush(); return out.join("");
}

async function post(route, body) {
  const r = await fetch(route, { method: "POST", headers: { "Content-Type": "application/json", "X-ADW-Token": TOKEN }, body: JSON.stringify(body) });
  if (r.status === 403) { location.reload(); throw new Error("page was stale; reloaded, try again"); }
  const j = await r.json().catch(() => ({ error: `HTTP ${r.status}` }));
  if (!r.ok || j.error) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}

function linkSelect(pane, current, epics) {
  return `<select class="linksel" data-link="${esc(pane)}"><option value="">${current ? "unlink" : "link to epic…"}</option>
    ${epics.map(n => `<option value="${esc(n)}" ${n === current ? "selected" : ""}>${esc(n)}</option>`).join("")}</select>`;
}
function tabPicker(epic, agents) {
  const free = agents.filter(a => a.epic !== epic);
  return `<select class="linksel" data-linkepic="${esc(epic)}"><option value="">link a tab…</option>
    ${free.map(a => `<option value="${esc(a.pane)}">${esc(a.pane)} · ${esc(a.kind)} · ${esc(a.title.slice(0, 40))}</option>`).join("")}</select>`;

function patch(el, html, after) {

  if (el.id === "needs") { if (armed && el.querySelector(".go.armed")) return; needsPatchedAt = Date.now(); }
  const act = document.activeElement, key = act && act.dataset && act.dataset.draft, pos = key && el.contains(act) && [act.selectionStart, act.selectionEnd];
  const plain = () => [...el.querySelectorAll("details:not([data-dk])")];

const BUCKET = new Map();
[["done", "merged done deployed merged-deployed done-direct-prod executed closed"], ["fl", "building pr-open pr-ready in_progress"],
 ["q", "ready pending queued"], ["bl", "blocked held parked"]].forEach(([k, v]) => v.split(" ").forEach(s => BUCKET.set(s, k)));
const bucketOf = s => BUCKET.get(s) || "other";
function tally(counts) {
  const t = { done: 0, fl: 0, q: 0, bl: 0, other: 0, otherSt: [] };
  for (const [s, n] of Object.entries(counts || {})) {
    const k = bucketOf(s), v = Number(n) || 0;
    t[k] += v; if (k === "other" && v) t.otherSt.push(`${s} ${v}`);
  }
  return t;
}

async function loadSince() {
  try {
    const r = await fetch(`/api/feed?after_id=${viewFrom}&order=asc`, { cache: "no-store" });
    const f = await r.json(); if (!r.ok || !f.events) return;
    sinceFeed = f; renderSince();
    const rendered = f.events.reduce((m, e) => Math.max(m, e.id), 0);
    const key = viewFrom + ":" + rendered;
    if (key !== tldrKey && f.events.length) {
      tldrKey = key;
      fetch(`/api/tldr?after_id=${viewFrom}&upto=${rendered}`, { cache: "no-store" }).then(x => x.json()).then(t => { if (tldrKey === key) { sinceTldr = t; renderSince(); } }).catch(() => { if (tldrKey === key) tldrKey = ""; });
    }
    if (document.visibilityState === "visible" && rendered > getSeen()) {
      visSince = visSince || Date.now();
      if (Date.now() - visSince >= 10000) {
        setSeen(rendered); visSince = 0;
        if (f.truncated) { viewFrom = rendered; sinceTldr = null; tldrKey = ""; return loadSince(); }
      }
    } else visSince = 0;
  } catch (e) {}
}

function render(b) {

  patch(cte, showCt ? clientTimeHtml(ct) : ""); cte.hidden = !showCt;
  const lte = document.getElementById("logtime"), ltHtml = logTimeHtml(ct);
  patch(lte, ltHtml); lte.hidden = !ltHtml;
  const TAG = { blocked: ["red", "dialog"], asks: ["dim", "may ask"], unsent: ["amber", "unsent draft"] };
  const urgent = a => a.attention === "blocked";
  const parked = agents.filter(a => !urgent(a) && a.attention !== "working" && a.attention !== "background")
    .sort((x, y) => (y.last_active || 0) - (x.last_active || 0));

  const tabCard = a => {
    const k = "r:" + a.pane;
    const reply = a.attention === "blocked"
      ? `<div class="actions"><span class="dim">It's showing a dialog; answer it in the tab.</span><button class="ghost" data-view="${esc(a.pane)}">View</button>${snoozeBtns("p:" + (a.session || a.pane))}</div>`
      : `<textarea data-draft="${esc(k)}" placeholder="Reply to this agent">${esc(drafts[k] || "")}</textarea>
         <div class="actions"><button class="go" data-reply="${esc(a.pane)}">Send</button><button class="ghost" data-view="${esc(a.pane)}">View</button><span class="status" id="st-${esc(a.pane)}"></span></div>`;
    const [c, label] = TAG[a.attention] || ["dim", a.attention];
    return `<div class="item"><div class="row">${TAG[a.attention] ? `<span class="tag ${c}">${label}</span>` : ""}
      <span class="mono dim" data-view="${esc(a.pane)}">${esc(a.pane)}</span><span class="dim">${a.last_active ? `active ${ago(a.last_active)} ago` : "last activity unknown"}</span> <span>${esc(a.title)}</span>${a.epic ? ` <span class="tag">${esc(a.epic)}</span>` : ""}</div>
      ${a.summary && a.attention !== "blocked" ? `<div style="margin-top:4px">${md(a.summary)}</div>` : ""}
      ${a.screen ? `<details ${a.attention === "blocked" ? "open" : ""}><summary>last screen</summary><div class="screen">${esc(a.screen)}</div></details>` : ""}${reply}</div>`;
  };
  const dialogRow = a => `<details class="nrow" ${dk("p:" + (a.session || a.pane))}><summary><span class="tag red">dialog</span><span class="mono dim">${esc(a.pane)}</span>
    ${a.epic ? `<span class="tag">${esc(a.epic)}</span>` : ""}<span class="ttl">${esc(a.title)}</span><span class="dim">${a.last_active ? `active ${ago(a.last_active)} ago` : ""}</span>
    <span class="rb"><button class="ghost" data-view="${esc(a.pane)}">View</button></span></summary><div class="nbody">${tabCard(a)}</div></details>`;
  for (const d of decs.filter(d => d.status === "open" && snz["d:" + d.id])) sleeping.push(["d:" + d.id, decisionRow(d)]);
  for (const a of agents.filter(urgent)) {
    const k = "p:" + (a.session || a.pane);
    if (snz[k]) sleeping.push([k, dialogRow(a)]);
  }
  const byKey = {};
  for (const d of decs) byKey["d:" + d.id] = () => decisionRow(d);
  for (const i of b.interrupts || []) byKey["i:" + i.id] = () => interruptRow(i);
  for (const t of ct.pending || []) byKey["t:" + t.item_id] = () => ticketRow(t);
  for (const r of ct.unconfirmed || []) byKey["h:" + r.id] = () => hoursRow(r);
  for (const a of agents) byKey["p:" + (a.session || a.pane)] = () => dialogRow(a);
  const nitems = (b.needs || []).filter(x => byKey[x.key]);
  const n = nitems.length, needs = nitems.map(x => byKey[x.key]());
  const cleared = b.cleared || [];
  const answered = decs.filter(d => d.status === "answered");

const ANSI16 = ["#1e1e1e","#e06c75","#98c379","#e5c07b","#61afef","#c678dd","#56b6c2","#dcdfe4",
  "#5c6370","#ff7b86","#b5e890","#ffd68a","#82c4ff","#e09cff","#7fd6e0","#ffffff"];
function c256(n) {
  if (n < 16) return ANSI16[n];
  if (n >= 232) { const v = 8 + (n - 232) * 10; return `rgb(${v},${v},${v})`; }
  n -= 16; const f = x => x ? 55 + x * 40 : 0; return `rgb(${f(Math.floor(n / 36))},${f(Math.floor(n / 6) % 6)},${f(n % 6)})`;
}
function ansiHtml(src) {
  let st = {}, out = "", open = false;
  const flush = () => { if (open) { out += "</span>"; open = false; } };
  const start = () => {
    const css = [];
    if (st.fg) css.push(`color:${st.fg}`); if (st.bg) css.push(`background:${st.bg}`);
    if (st.b) css.push("font-weight:700"); if (st.dim) css.push("opacity:.6"); if (st.i) css.push("font-style:italic");
    if (st.u) css.push("text-decoration:underline"); if (st.inv) css.push("filter:invert(1)");
    if (css.length) { out += `<span style="${css.join(";")}">`; open = true; }
  };
  const re = /\x1b\[([0-9;:]*)m|\x1b\[[0-9;?]*[A-Za-z]|\x1b\][^\x07\x1b]*(?:\x07|\x1b\\)|\x1b[()][A-Z0-9]|[\x00-\x08\x0b-\x1f]/g;
  let i = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(i, m.index)); i = re.lastIndex;
    if (m[1] === undefined) continue;
    const p = m[1] === "" ? [0] : m[1].split(/[;:]/).map(Number);
    for (let k = 0; k < p.length; k++) {
      const c = p[k];
      if (c === 0) st = {}; else if (c === 1) st.b = 1; else if (c === 2) st.dim = 1; else if (c === 3) st.i = 1;
      else if (c === 4) st.u = 1; else if (c === 7) st.inv = 1; else if (c === 22) { st.b = 0; st.dim = 0; }
      else if (c === 23) st.i = 0; else if (c === 24) st.u = 0; else if (c === 27) st.inv = 0;
      else if (c >= 30 && c <= 37) st.fg = ANSI16[c - 30]; else if (c >= 90 && c <= 97) st.fg = ANSI16[c - 82];
      else if (c >= 40 && c <= 47) st.bg = ANSI16[c - 40]; else if (c >= 100 && c <= 107) st.bg = ANSI16[c - 92];
      else if (c === 39) st.fg = null; else if (c === 49) st.bg = null;
      else if (c === 38 || c === 48) {
        let col = null;
        if (p[k + 1] === 5) { col = c256(p[k + 2]); k += 2; }
        else if (p[k + 1] === 2) { col = `rgb(${p[k + 2]},${p[k + 3]},${p[k + 4]})`; k += 4; }
        if (c === 38) st.fg = col; else st.bg = col;
      }
    }
    flush(); start();
  }
  out += esc(src.slice(i)); flush();
  return out;
}

  vBusy = false;
}
document.getElementById("mate-btn").addEventListener("click", e => { if (e.currentTarget.dataset.pane) openViewer(e.currentTarget.dataset.pane); });
function openViewer(pane, fromNav) {
  if (!fromNav && location.hash !== "#view=" + pane) {
    try { history.pushState({ view: pane }, "", "#view=" + pane); } catch (e) {}
  }
  vPane = pane; const a = (last && last.agents || []).find(a => a.pane === pane);
  $("v-pane").textContent = pane; $("v-title").textContent = a ? a.title : "";
  $("v-term").innerHTML = ""; $("viewer").classList.add("open"); document.body.style.overflow = "hidden";
  vRefresh().then(() => { $("v-term").scrollTop = $("v-term").scrollHeight; });
  clearInterval(vTimer); vTimer = setInterval(vRefresh, 1500);
}
function hideViewer() {
  vPane = null; clearInterval(vTimer); $("viewer").classList.remove("open"); document.body.style.overflow = "";
}
function closeViewer() {
  if (history.state && history.state.view) { history.back(); return; }
  hideViewer();
  try { history.replaceState(null, "", location.pathname); } catch (e) {}
}
$("v-close").addEventListener("click", closeViewer);
document.addEventListener("keydown", e => { if (e.key === "Escape" && vPane && document.activeElement !== $("v-text")) closeViewer(); });
$("v-focus").addEventListener("click", () => vPane && post("/api/focus", { pane: vPane }).catch(e => $("v-st").textContent = e.message));
const KEYS_KEY = "board.viewerKeys";
function setKeys(on, save) {
  $("viewer").classList.toggle("keys-on", on);
  $("v-keys").setAttribute("aria-pressed", String(on));
  $("v-keys").title = on ? "Hide keys" : "Show keys";
  if (save) { try { localStorage.setItem(KEYS_KEY, on ? "1" : "0"); } catch (e) {} }
}
(() => { let v = null; try { v = localStorage.getItem(KEYS_KEY); } catch (e) {}
  setKeys(v === null ? matchMedia("(min-width: 521px)").matches : v === "1", false); })();
$("v-keys").addEventListener("click", () => setKeys(!$("viewer").classList.contains("keys-on"), true));
document.querySelectorAll("#viewer [data-key]").forEach(b => b.addEventListener("click", async e => {
  e.stopPropagation();
  try { await post("/api/keys", { pane: vPane, keys: [b.dataset.key] }); setTimeout(vRefresh, 300); }
  catch (err) { $("v-st").textContent = err.message; }
}));
$("v-send").addEventListener("click", async () => {
  const text = $("v-text").value.trim(); if (!text || !vPane) return;
  $("v-send").disabled = true;
  try { await post("/api/reply", { pane: vPane, text }); $("v-text").value = ""; setTimeout(vRefresh, 400); }
  catch (e) { $("v-st").textContent = e.message; }
  $("v-send").disabled = false;
});
document.addEventListener("click", e => {
  const v = e.target.closest("[data-view]"); if (!v || v.closest("#viewer")) return;
  e.preventDefault(); openViewer(v.dataset.view);
}, true);
const fromHash = () => {
  if (location.hash.startsWith("#view=")) openViewer(decodeURIComponent(location.hash.slice(6)), true);
  else if (vPane) hideViewer();
};
window.addEventListener("popstate", fromHash);
setTimeout(fromHash, 300);

document.addEventListener("change", async e => {
  const t = e.target; if (!t.classList || !t.classList.contains("linksel")) return;
  const pane = t.dataset.link || t.value, epic = t.dataset.link ? t.value : t.dataset.linkepic;
  if (!pane) return;
  t.disabled = true;
  try { await post("/api/link", { pane, epic }); tick(); } catch (err) { alert(err.message); t.disabled = false; }
});

let last = null;
async function tick() {
  try {
    const r = await fetch("/api/board", { cache: "no-store" });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    last = await r.json(); render(last); loadSince();
    document.getElementById("err").textContent = "";
    document.getElementById("meta").textContent = `updated ${new Date(last.generated * 1000).toLocaleTimeString()} · refreshes every 10s`;
  } catch (e) { document.getElementById("err").textContent = `refresh failed: ${e.message}`; }
}
tick(); setInterval(tick, 10000);
</script>
</body>
